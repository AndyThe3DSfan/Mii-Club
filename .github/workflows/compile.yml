name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This pulls a stable toolchain container that bypasses marketplace dependencies entirely
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile 3DSX
        run: |
          # Bypass git security walls on GitHub's server environment
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Map out the exact file paths manually inside the container environment
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: mii-club-build
          path: |
            *.3dsx
            *.elf
