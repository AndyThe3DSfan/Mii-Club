name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This specific image has all 3DS tools, rules, and 3ds.h completely pre-installed
    container: devkitpro/toolchain-3ds:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile 3DSX
        run: |
          # Bypass git security blocks on GitHub's server
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Clean old build caches and run the compiler
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game-build
          path: |
            *.3dsx
            *.elf
