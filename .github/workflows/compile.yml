name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Setup 3DS Toolchain
        run: |
          # 1. Download official portable devkitARM and 3DS development rules
          mkdir -p $HOME/devkitpro
          wget -qO- https://github.com | tar -xzf - -C $HOME/devkitpro
          
          # 2. Grab a stable build of the arm compiler binaries directly
          wget -q https://github.com
          tar -xf devkitarm-r55-x86_64-linux.tar.xz -C $HOME/devkitpro
          
          # 3. Pull down the missing 3ds.h and libctru header files directly into the repository
          git clone --depth=1 https://github.com
          mkdir -p source/include
          cp -r libctru/libctru/include/* source/

      - name: Compile 3DSX
        run: |
          # Setup paths for the bare compiler variables
          export DEVKITPRO=$HOME/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # Force compiler flags to look inside our pulled include folders for 3ds.h
          export EXTRACXXFLAGS="-I../libctru/libctru/include"
          export EXTRACFLAGS="-I../libctru/libctru/include"
          
          make clean || true
          make EXTRACXXFLAGS="$EXTRACXXFLAGS" EXTRACFLAGS="$EXTRACFLAGS"
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game-build
          path: |
            *.3dsx
            *.elf
