name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 3DS Development Libraries
        run: |
          # Installs libctru, citro3d, and the 3DS build rules
          sudo dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game-build
          path: |
            *.3dsx
            *.elf
