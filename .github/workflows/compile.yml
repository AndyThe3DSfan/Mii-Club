name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up devkitPRO Environment
        uses: devkitPro/actions/setup-tools@v1
        with:
          # This forces GitHub to load the exact, stable 3DS packages directly
          platform: 3ds

      - name: Compile 3DSX
        run: |
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game-build
          path: |
            *.3dsx
            *.elf
