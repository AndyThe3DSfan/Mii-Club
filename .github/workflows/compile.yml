name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Official 3DS Toolchain
        run: |
          # The secret flag (-U) forces the devkitPro server to accept our connection
          wget -U "dkp-apt" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --noconfirm
          
          # Directly install the 3DS development packages
          sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          # Map out the exact tool file paths manually
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: miiclub-build
          path: |
            *.3dsx
            *.elf
