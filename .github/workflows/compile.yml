name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 3DS Components Natively
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # This creates a perfect shortcut folder inside your source folder 
          # so your code finds <3ds.h> without needing the Makefile's permission!
          ln -s /opt/devkitpro/libctru/include/3ds.h source/3ds.h
          ln -s /opt/devkitpro/libctru/include/3ds source/3ds
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: mii-club-build
          path: |
            *.3dsx
            *.elf
