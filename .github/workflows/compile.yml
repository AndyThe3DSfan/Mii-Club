name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Official devkitARM Compiler Tools
        run: |
          # Create a secure home directory for the tools
          mkdir -p $HOME/devkitpro
          
          # Download the verified standalone Linux devkitARM compiler package
          wget -q https://github.com || wget -q https://github.com
          tar -xf devkitARM_r55-x86_64-linux.tar.xz -C $HOME/devkitpro
          
          # Clone the official 3DS hardware library headers directly so 3ds.h is present
          git clone --depth=1 https://github.com $HOME/devkitpro/libctru

      - name: Compile 3DSX
        run: |
          # Map out the exact file paths manually
          export DEVKITPRO=$HOME/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # Inject the missing 3ds.h library path straight into your Makefile's compiler rule
          export CFLAGS="-I$DEVKITPRO/libctru/libctru/include $CFLAGS"
          export CXXFLAGS="-I$DEVKITPRO/libctru/libctru/include $CXXFLAGS"
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: miiclub-build
          path: |
            *.3dsx
            *.elf
