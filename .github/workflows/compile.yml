name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This officially mounts the complete, pre-authenticated 3DS developer kit
      - name: Set up devkitPro
        uses: devkitPro/actions-setup@v1
        with:
          actions: '3ds-dev'

      - name: Compile 3DSX
        run: |
          # Explicitly match system folders to the freshly mounted devkitPro runner paths
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: mii-club-build
          path: |
            *.3dsx
            *.elf
