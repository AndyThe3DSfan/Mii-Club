name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 3DS Components Natively
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # This forces the compiler to look in the exact directory where 3ds.h was just installed
          export EXTRACXXFLAGS="-I/opt/devkitpro/libctru/include"
          export EXTRACFLAGS="-I/opt/devkitpro/libctru/include"
          
          make clean || true
          make EXTRACXXFLAGS="$EXTRACXXFLAGS" EXTRACFLAGS="$EXTRACFLAGS"
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: mii-club-build
          path: |
            *.3dsx
            *.elf
