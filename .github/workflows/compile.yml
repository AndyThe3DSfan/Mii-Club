name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This uses the official working image name
    container: 
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Pacman Databases
        run: |
          # Safely syncs databases within the container
          dkp-pacman -Sy --noconfirm

      - name: Install 3DS Development Tools
        run: |
          # Safely installs the 3ds components without sudo blocks
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game-build
          path: |
            *.3dsx
            *.elf
