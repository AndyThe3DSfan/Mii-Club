name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Official 3DS Toolchain
        run: |
          wget -U "dkp-apt" https://devkitpro.org
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --noconfirm
          sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # This forces the compiler to look in the exact directory where 3ds.h was installed
          export EXTRACXXFLAGS="-I/opt/devkitpro/libctru/include"
          export EXTRACFLAGS="-I/opt/devkitpro/libctru/include"
          
          make clean || true
          make EXTRACXXFLAGS="$EXTRACXXFLAGS" EXTRACFLAGS="$EXTRACFLAGS"
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: miiclub-build
          path: |
            *.3dsx
            *.elf
