name: Build 3DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This uses the official devkitPro image, but overrides permissions safely
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install 3DS Components Natively
        run: |
          # 1. Update the internal package manager directly without a website link
          dkp-pacman -Syy --noconfirm
          
          # 2. Force install the core 3DS hardware libraries 
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Compile 3DSX
        run: |
          # 3. Explicitly link the environment paths
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          make clean || true
          make
          
      - name: Upload Finished 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: mii-club-build
          path: |
            *.3dsx
            *.elf
